# Quality gates for this repository, mirroring .github/workflows/lint.yml for
# the checks whose tools are installed locally (shellcheck, chezmoi).
#
# pre-commit runs on staged files only, pre-push validates the whole source.
# Git runs them once `lefthook install` has been run in a clone. The Claude
# Code hook (home/dot_claude/scripts/executable_hook.sh) invokes the same two
# stages with `lefthook run <stage>`, which needs no install.

pre-commit:
  parallel: true
  jobs:
    - name: shellcheck scripts
      glob: "home/{dot_claude/scripts,dot_install.d,dot_local/bin}/executable_*"
      run: shellcheck -s bash -e SC1091 {staged_files}

    - name: shellcheck script templates
      glob: "home/.chezmoiscripts/**/*.sh.tmpl"
      run: |
        rc=0
        for file in {staged_files}; do
          chezmoi execute-template < "$file" | shellcheck -s bash -e SC1091 - || rc=1
        done
        exit $rc

pre-push:
  jobs:
    - name: shellcheck rendered script templates
      run: |
        rc=0
        for file in $(find home/.chezmoiscripts -name "*.sh.tmpl"); do
          chezmoi execute-template < "$file" | shellcheck -s bash -e SC1091 - || rc=1
        done
        exit $rc
